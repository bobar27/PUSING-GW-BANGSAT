<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In / Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header>
    <a href="#">TITLE</a>
    <a href="#">HOME</a>
    <a href="#">INSERT</a>
    <a href="#">SIGN IN/LOG IN</a>
  </header>

  <main class="auth-main">
    <div class="auth-box">
      <h1 id="formTitle">SIGN IN</h1>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active" onclick="showForm('login')">LOG IN</button>
        <button type="button" id="tabSignup" onclick="showForm('signup')">SIGN UP</button>
      </div>

      <!-- Login form -->
      <form id="loginForm" class="auth-form active">
        <div id="loginError" class="auth-error"></div>
        <div class="auth-field">
          <label for="loginEmail">EMAIL</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label for="loginPassword">PASSWORD</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div class="auth-row-between">
          <label class="auth-checkbox">
            <input type="checkbox" id="remember">
            REMEMBER ME
          </label>
          <a href="#">FORGOT PASSWORD?</a>
        </div>
        <button type="submit" class="auth-submit-btn">LOG IN</button>
        <div class="auth-switch-text">
          DON'T HAVE AN ACCOUNT?
          <button type="button" onclick="showForm('signup')">SIGN UP</button>
        </div>
      </form>

      <!-- Signup form -->
      <form id="signupForm" class="auth-form">
        <div id="signupError" class="auth-error"></div>
        <div class="auth-field">
          <label for="signupName">FULL NAME</label>
          <input type="text" id="signupName" placeholder="Your Name" required>
        </div>
        <div class="auth-field">
          <label for="signupEmail">EMAIL</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label for="signupPassword">PASSWORD</label>
          <input type="password" id="signupPassword" placeholder="•••••••• (min 8 characters)" required minlength="8">
        </div>
        <div class="auth-field">
          <label for="signupConfirm">CONFIRM PASSWORD</label>
          <input type="password" id="signupConfirm" placeholder="••••••••" required minlength="8">
        </div>
        <button type="submit" class="auth-submit-btn">SIGN UP</button>
        <div class="auth-switch-text">
          ALREADY HAVE AN ACCOUNT?
          <button type="button" onclick="showForm('login')">LOG IN</button>
        </div>
      </form>

    </div>
  </main>

  <footer>
    <a href="#">@ABOUT US</a>
    <a href="#">@ABOUT US</a>
    <a href="#">@ABOUT US</a>
  </footer>

</div>

<script>
  function showForm(type) {
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabSignup = document.getElementById('tabSignup');
    const title = document.getElementById('formTitle');

    clearError('loginError');
    clearError('signupError');

    if (type === 'login') {
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      title.textContent = 'SIGN IN';
    } else {
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      title.textContent = 'SIGN UP';
    }
  }

  function showError(elId, message) {
    const el = document.getElementById(elId);
    el.textContent = message;
    el.style.display = 'block';
  }

  function clearError(elId) {
    const el = document.getElementById(elId);
    el.textContent = '';
    el.style.display = 'none';
  }

  // Same-origin API base — works once this page is served by the
  // Express server itself (see backend/server.js).
  const API_BASE = '/api';

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearError('loginError');

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError('loginError', data.error || 'Log in failed.');
        return;
      }

      window.location.href = 'index.html';
    } catch (err) {
      showError('loginError', 'Could not reach the server. Is it running?');
    }
  });

  document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearError('signupError');

    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirm').value;

    if (password !== confirm) {
      showError('signupError', 'Passwords do not match.');
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError('signupError', data.error || 'Sign up failed.');
        return;
      }

      window.location.href = 'index.html';
    } catch (err) {
      showError('signupError', 'Could not reach the server. Is it running?');
    }
  });
</script>

</body>
</html>
